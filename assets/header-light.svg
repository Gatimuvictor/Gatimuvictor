      <text x="617.5" y="285.5" text-anchor="middle" class="sans" font-size="15" font-weight="600" fill="#0969da">D365 Business Central</text>
    </g>
  </g>

  <g class="fade" style="animation-delay:.45s" filter="url(#shadow)">
    <rect x="742" y="74" width="404" height="232" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
    <path d="M742 88a14 14 0 0 1 14 -14h376a14 14 0 0 1 14 14v26h-404z" fill="#eef1f5"/>
    <line x1="742" y1="114" x2="1146" y2="114" stroke="#d0d7de"/>
    <circle cx="764" cy="94" r="5.5" fill="#ff5f57"/>
    <circle cx="782" cy="94" r="5.5" fill="#febc2e"/>
    <circle cx="800" cy="94" r="5.5" fill="#28c840"/>
    <text x="944" y="99" text-anchor="middle" class="mono" font-size="12.5" fill="#59636e">profile.php</text>
  </g>
  <g>
    <text x="766" y="152" class="mono line" font-size="14" style="animation-delay:0.8s"><tspan fill="#8250df">$victor</tspan><tspan fill="#59636e">&#160;=&#160;[</tspan></text>
    <text x="766" y="177" class="mono line" font-size="14" style="animation-delay:0.92s"><tspan fill="#cf222e">&#160;&#160;&#160;&#160;&#39;backend&#39;</tspan><tspan fill="#59636e">&#160;=&gt;&#160;[</tspan><tspan fill="#0a3069">&#39;Laravel&#39;</tspan><tspan fill="#59636e">,&#160;</tspan><tspan fill="#0a3069">&#39;Django&#39;</tspan><tspan fill="#59636e">],</tspan></text>
    <text x="766" y="202" class="mono line" font-size="14" style="animation-delay:1.04s"><tspan fill="#cf222e">&#160;&#160;&#160;&#160;&#39;data&#39;&#160;&#160;&#160;</tspan><tspan fill="#59636e">&#160;=&gt;&#160;[</tspan><tspan fill="#0a3069">&#39;MySQL&#39;</tspan><tspan fill="#59636e">,&#160;</tspan><tspan fill="#0a3069">&#39;PostgreSQL&#39;</tspan><tspan fill="#59636e">],</tspan></text>
    <text x="766" y="227" class="mono line" font-size="14" style="animation-delay:1.1600000000000001s"><tspan fill="#cf222e">&#160;&#160;&#160;&#160;&#39;erp&#39;&#160;&#160;&#160;&#160;</tspan><tspan fill="#59636e">&#160;=&gt;&#160;</tspan><tspan fill="#0a3069">&#39;Business&#160;Central&#39;</tspan><tspan fill="#59636e">,</tspan></text>
    <text x="766" y="252" class="mono line" font-size="14" style="animation-delay:1.28s"><tspan fill="#cf222e">&#160;&#160;&#160;&#160;&#39;focus&#39;&#160;&#160;</tspan><tspan fill="#59636e">&#160;=&gt;&#160;</tspan><tspan fill="#0a3069">&#39;reliable&#160;systems&#39;</tspan><tspan fill="#59636e">,</tspan></text>
    <text x="766" y="277" class="mono line" font-size="14" style="animation-delay:1.4s"><tspan fill="#59636e">];</tspan></text>
  </g>
</svg>

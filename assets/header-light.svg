<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="John Victor Gatimu, Full Stack Systems Developer">
<title>John Victor Gatimu, Full Stack Systems Developer</title>
<style>
  .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Ubuntu, 'Noto Sans', Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'Liberation Mono', Menlo, monospace; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  
  .fade { animation: fadeUp .7s cubic-bezier(.2,.7,.2,1) both; }
  .line { animation: fadeIn .5s ease both; }
  .orbA { animation: driftA 14s ease-in-out infinite alternate; }
  .orbB { animation: driftB 18s ease-in-out infinite alternate; }
  .cursor { animation: blink 1.1s steps(1) infinite; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes driftA { from { transform: translate(0,0); } to { transform: translate(60px,30px); } }
  @keyframes driftB { from { transform: translate(0,0); } to { transform: translate(-70px,-20px); } }
  @keyframes blink { 50% { opacity: 0; } }
</style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7faff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="role" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0969da"/>
      <stop offset="1" stop-color="#8250df"/>
    </linearGradient>
    <radialGradient id="glowA"><stop offset="0" stop-color="#0969da" stop-opacity="0.18"/><stop offset="1" stop-color="#0969da" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB"><stop offset="0" stop-color="#8250df" stop-opacity="0.14"/><stop offset="1" stop-color="#8250df" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#aab3bd" fill-opacity="0.45"/>
    </pattern>
    <linearGradient id="dotFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".55" stop-color="#fff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".4"/>
    </linearGradient>
    <mask id="dotMask"><rect width="1200" height="360" fill="url(#dotFade)"/></mask>
    <clipPath id="frame"><rect width="1200" height="360" rx="22"/></clipPath>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#1f2328" flood-opacity="0.12"/>
    </filter>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#dots)" mask="url(#dotMask)"/>
    <circle class="orbA" cx="880" cy="70" r="300" fill="url(#glowA)"/>
    <circle class="orbB" cx="1120" cy="340" r="260" fill="url(#glowB)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="359" rx="21.5" fill="none" stroke="#d0d7de"/>

  <g class="fade" style="animation-delay:.05s">
    <text x="64" y="92" class="mono" font-size="16" fill="#59636e"><tspan fill="#1a7f37">~/gatimuvictor</tspan> $ whoami<tspan class="cursor" fill="#0969da">&#160;_</tspan></text>
  </g>
  <g class="fade" style="animation-delay:.18s">
    <text x="62" y="162" class="sans" font-size="58" font-weight="700" letter-spacing="-1.2" fill="#1f2328">John Victor Gatimu</text>
  </g>
  <g class="fade" style="animation-delay:.32s">
    <text x="64" y="214" class="sans" font-size="28" font-weight="600" fill="url(#role)">Full Stack Systems Developer</text>
  </g>

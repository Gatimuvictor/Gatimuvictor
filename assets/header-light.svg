      <text x="111.5" y="285.5" text-anchor="middle" class="sans" font-size="15" font-weight="600" fill="#0969da">Laravel</text>
    </g>
    <g class="fade" style="animation-delay:0.63s">
      <rect x="169" y="262" width="86" height="36" rx="18" fill="#0969da" fill-opacity="0.07" stroke="#0969da" stroke-opacity="0.35"/>
      <text x="212" y="285.5" text-anchor="middle" class="sans" font-size="15" font-weight="600" fill="#0969da">Django</text>
    </g>
    <g class="fade" style="animation-delay:0.7100000000000001s">
      <rect x="265" y="262" width="234" height="36" rx="18" fill="#0969da" fill-opacity="0.07" stroke="#0969da" stroke-opacity="0.35"/>
      <text x="382" y="285.5" text-anchor="middle" class="sans" font-size="15" font-weight="600" fill="#0969da">Database Administration</text>
    </g>
    <g class="fade" style="animation-delay:0.79s">
